name: Verify patches

on:
  push:
  pull_request:
  schedule:
    # Weekly, to notice early when a Chromium bump would be needed.
    - cron: "17 6 * * 1"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patches apply to upstream Chromium
        run: python3 scripts/verify_patches.py
      - name: Shell scripts parse
        run: for f in scripts/*.sh packaging/linux/archie; do bash -n "$f"; done
